# site-assets/ is a byte-for-byte mirror of the site's own frontend bundles
# (generated by scripts/gen-site-assets.js, pinned by manifest sha256 + CI --check).
# Any key-looking string in there (e.g. the site's public X-Goog-Api-Key in
# app.v2.js) ships publicly in the site's own JS; it is not ours to revoke.
# Alerts inside this directory are closed automatically as "ignored by configuration".
paths-ignore:
  - "plugins/app/ios/Sources/SangTacAppPlugin/site-assets/**"
