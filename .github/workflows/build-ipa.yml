name: Build unsigned IPA (Capacitor)

# 云端只编译出**未签名** IPA；签名与安装交给设备端
# （SideStore / LiveContainer / SideInstaller 用你自己的 Apple ID 本地签名）。
#
# 架构说明：本 workflow 构建的是 Capacitor iOS 工程，与安卓 APK 同构
# （server.url 远程加载 sangtacviet.com/app.v2.php + 原生插件）。
#
# ios/ 平台目录**故意不入库**：它由 macOS runner 上的 `npx cap add ios` 生成，
# 避免 Windows 上生成时把反斜杠路径写进 CapApp-SPM/Package.swift
# （macOS 的 Swift 无法解析反斜杠，见 newsnook-ios 的同类踩坑）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile
    runs-on: macos-26
    timeout-minutes: 60

    # 发布滚动 Release 需要写权限（默认 GITHUB_TOKEN 只有读权限）。
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify injected document-start shim is valid JavaScript
        run: node scripts/check-ios-shim.js

      - name: Verify site-patch behaviour
        run: node scripts/test-site-patch.js

      - name: Verify generated i18n block is in sync
        run: node scripts/gen-site-i18n.js --check

      - name: Verify the bundled site-asset mirror is in sync
        run: node scripts/gen-site-assets.js --check

      - name: List detected plugins
        run: npx cap ls || true

      - name: Add iOS platform
        run: |
          set -euo pipefail
          if [ ! -d ios/App ]; then
            npx cap add ios
          else
            echo "ios/App 已存在，跳过 cap add"
          fi

      - name: Sync web assets and Capacitor plugins
        run: npx cap sync ios

      # 锁屏后 TTS 还能继续念，前提之一是应用声明了后台音频模式。
      # ios/ 由 `cap add ios` 生成、故意不入库，Capacitor 模板的 Info.plist 不带
      # UIBackgroundModes，所以这一条只能在 macOS runner 上补。
      # 用「存在则跳过、追加到数组末尾」而不是 Delete+Add：将来模板或插件自己
      # 加了别的后台模式时，这里不能把它删掉。
      - name: Enable background audio mode
        run: |
          set -euo pipefail
          plist=ios/App/App/Info.plist
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" 2>/dev/null | grep -q 'audio'; then
            echo "UIBackgroundModes 已含 audio，跳过"
          else
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$plist" 2>/dev/null || true
            index=0
            while /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:$index" "$plist" >/dev/null 2>&1; do
              index=$((index + 1))
            done
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:$index string audio" "$plist"
          fi
          echo "=== UIBackgroundModes ==="
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist"

      # 优化方案 §4/S7：ATS 必须开着。站点、图床（static.sangtacvietcdn.xyz、
      # bookcover.yuewen.com 等）与 Turnstile 全是 https，没有任何需要明文 http 的
      # 地方；而本机看不到 ios/（故意不入库），所以这条只能在 runner 上落地。
      # 先如实打印模板给的是什么（这就是 S7 要的那个答案），再强制关掉
      # NSAllowsArbitraryLoads；键不存在就不动 —— 缺省本来就是 ATS 生效。
      - name: Force ATS on (audit arbitrary loads)
        run: |
          set -euo pipefail
          plist=ios/App/App/Info.plist
          echo "=== NSAppTransportSecurity before ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$plist" 2>/dev/null \
            || echo "(模板没有 NSAppTransportSecurity 键，ATS 按缺省生效)"
          if /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads false" "$plist"
            echo "已把 NSAllowsArbitraryLoads 设为 false"
          else
            echo "NSAllowsArbitraryLoads 未声明，无需改动"
          fi
          echo "=== NSAppTransportSecurity after ==="
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$plist" 2>/dev/null || true

      - name: Verify generated SPM manifest
        run: |
          set -euo pipefail
          cat ios/App/CapApp-SPM/Package.swift
          # 三个本地插件必须被 cap sync 写进清单，否则原生插件不参与编译。
          # Capacitor 可能写 npm 包名（@sangtac/http）或反解后的真实路径
          # （plugins/http），两种都接受。
          hits="$(grep -c -E 'plugins/(http|app|webnativeview)' ios/App/CapApp-SPM/Package.swift || true)"
          echo "本地插件清单命中行数: $hits"
          if [ "$hits" -lt 3 ]; then
            echo "::error::Package.swift 未包含全部本地插件（命中 $hits 行，期望 >= 3）"
            exit 1
          fi
          if grep -q '\\' ios/App/CapApp-SPM/Package.swift; then
            echo "::error::Package.swift 含 Windows 反斜杠路径"
            exit 1
          fi

      - name: Verify plugin registration list
        run: |
          set -euo pipefail
          capjson="ios/App/App/capacitor.config.json"
          echo "=== $capjson (packageClassList) ==="
          python3 -c "import json,sys; d=json.load(open('$capjson')); print('\n'.join(d.get('packageClassList', [])))"
          for cls in SangTacHttpPlugin SangTacAppPlugin SangTacWebNativeViewPlugin; do
            grep -q "\"$cls\"" "$capjson" \
              || { echo "::error::$cls 不在 packageClassList 中，Capacitor 不会注册它"; exit 1; }
          done

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build \
            OTHER_LDFLAGS="\$(inherited) -ObjC" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee xcodebuild.log | tail -80

      # 后台音频模式必须真的进产物。缺了不会崩，表现只是「锁屏就停读」，而这
      # 正好是本轮要分开验证的两个根因之一——所以构建必须在这里红，不能靠真机
      # 反复试。plutil 直接读产物里的 plist（可能是二进制格式），比 strings 可靠。
      - name: Verify background audio mode is in the built app
        run: |
          set -euo pipefail
          app="$(find ios/App/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          plist="$app/Info.plist"
          echo "plist: $plist"
          modes="$(plutil -extract UIBackgroundModes json -o - "$plist" 2>/dev/null || true)"
          echo "UIBackgroundModes = ${modes:-<缺失>}"
          case "$modes" in
            *'"audio"'*) echo "✓ 后台音频模式已编入产物" ;;
            *) echo "::error::产物 Info.plist 缺少 UIBackgroundModes=audio（锁屏后应用会被立刻挂起）"; exit 1 ;;
          esac
          # S7：产物里的 ATS 也必须是真的开着。源码那一步改的是生成工程里的
          # plist，这一步读的是**编进 app 的那一份**——两者不一致时（例如某个
          # 插件把自己的 plist 合并进来）只有这里能发现。
          arbitrary="$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads json -o - "$plist" 2>/dev/null || echo '<absent>')"
          echo "NSAllowsArbitraryLoads = $arbitrary"
          case "$arbitrary" in
            true|1) echo "::error::产物开了 NSAllowsArbitraryLoads（ATS 被关闭，S7 未落地）"; exit 1 ;;
            *) echo "✓ 产物未开启明文加载（ATS 生效）" ;;
          esac

      - name: Verify native plugins are linked into the binary
        run: |
          set -euo pipefail
          app="$(find ios/App/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          bin="$app/$(basename "$app" .app)"
          echo "binary: $bin"
          # Dump the symbol table once: piping nm into `grep -q` makes grep exit
          # early, SIGPIPE-kills nm, and `set -o pipefail` then reports failure
          # even when the symbol is present.
          syms="$(mktemp)"
          nm -a "$bin" > "$syms"
          echo "=== 产物中的 SangTac ObjC 类符号 ==="
          grep -F 'OBJC_CLASS_$_SangTac' "$syms" || echo "(没有找到任何 SangTac 类符号)"
          for cls in SangTacHttpPlugin SangTacAppPlugin SangTacWebNativeViewPlugin; do
            if grep -q -F "_OBJC_CLASS_\$_$cls" "$syms"; then
              echo "✓ $cls 已链接"
            else
              echo "::error::原生插件 $cls 未链接进产物（站点会退回 web 模式）"
              exit 1
            fi
          done
          # Cordova 兼容层（nativeclick/TTS shim）必须真的编进产物：站点在点击
          # 小说时会先调 app.platform.nativeClick()，缺 nativeclick 就抛
          # ReferenceError，openBookWithData 永不执行（表现为「点不进详情」）。
          strings -a "$bin" > "$syms.strings"
          if grep -q -F 'stvIOSCompatInstalled' "$syms.strings"; then
            echo "✓ Cordova 兼容层已编入产物"
          else
            echo "::error::Cordova 兼容层缺失（nativeclick shim 不在二进制里）"
            exit 1
          fi
          # 诊断面板（window.__stvDiag）同样必须编进去，否则真机出错时没有任何
          # 可读日志（sideload 的 iOS 包看不到 console）。
          if grep -q -F 'stvDiagInstalled' "$syms.strings"; then
            echo "✓ 诊断面板已编入产物"
          else
            echo "::error::诊断面板缺失（__stvDiag shim 不在二进制里）"
            exit 1
          fi
          # 阅读翻页默认值 + 原生 TTS provider 注册同样要在产物里。
          for marker in stvReaderDefaultsInstalled stvTtsProviderInstalled stvTtsPlaybackInstalled \
                        stvI18nInstalled \
                        stvSafeAreaInstalled stvSettingsBackupInstalled stvDomainFailoverInstalled \
                        stvBookmarkToggleInstalled stvStorageAccessorInstalled \
                        stvGridLayoutInstalled stvTabProbeInstalled \
                        stvKeyboardPopupInstalled \
                        stvReaderTtsInstalled stvPageRepairInstalled stvBootShellInstalled \
                        stvAssetCache stvReaderPrefetchInstalled \
                        stvCommentTranslateInstalled stvAssetMirror \
                        stvCboxFrameInstalled stvComicGateInstalled \
                        siteAssetRefresh data-stv-mirror stv.domain.trap.off \
                        stvCoverFallbackInstalled stvFailureHintsInstalled \
                        stvDomainProbeInstalled bootOverlayHide; do
            if grep -q -F "$marker" "$syms.strings"; then
              echo "✓ $marker 已编入产物"
            else
              echo "::error::$marker 缺失"
              exit 1
            fi
          done
          # 诊断日志必须落盘：页面里的缓冲随崩溃一起消失，只有原生写的文件能活到
          # 下一次启动（「闪退后诊断日志就清空了，导致没有日志」）。
          for marker in stv-diagnostic.log diagAppend diagRead diagClear; do
            if grep -q -F "$marker" "$syms.strings"; then
              # ${marker}, never the bare form: the runner's locale makes bash
              # read the high bytes of a following full-width character as part
              # of the name, so the bare form next to a full-width bracket asked
              # for an unbound variable and `set -u` killed the step with no
              # output at all.
              echo "✓ 诊断日志落盘（${marker}）已编入产物"
            else
              echo "::error::诊断日志落盘缺失（${marker} 不在二进制里）"
              exit 1
            fi
          done
          # 原生语音合成的桥接方法名必须存在，否则站点调用 speakToFile 会 reject。
          if grep -q -F 'speakToFile' "$syms.strings"; then
            echo "✓ 原生 TTS 桥接方法已编入产物"
          else
            echo "::error::原生 TTS 桥接方法缺失（speakToFile 不在二进制里）"
            exit 1
          fi
          # 安全区与设置备份的原生桥接方法名同样要在产物里。secretSave/secretLoad
          # 是 API Key 的 Keychain 通道，缺了会让自备 Key 静默失效。
          for marker in getSafeArea settingsRestore settingsSave secretSave secretLoad; do
            if grep -q -F "$marker" "$syms.strings"; then
              echo "✓ $marker 已编入产物"
            else
              echo "::error::$marker 缺失"
              exit 1
            fi
          done
          # 导出已下载小说（TXT/EPUB）的原生桥接方法。缺了的话导出按钮会
          # 直接 reject，站点侧只能报「这个版本还没有导出功能」。
          if grep -q -F 'exportFile' "$syms.strings"; then
            echo "✓ exportFile 已编入产物"
          else
            echo "::error::exportFile 缺失（导出功能无法送达系统分享面板）"
            exit 1
          fi
          # Http 插件的诊断开关。缺了不会崩，但原生侧的门会一直关着，面板里就只剩
          # 失败行——一个只会让性能优化静默回退的洞。
          if grep -q -F 'setDiagnostics' "$syms.strings"; then
            echo "✓ setDiagnostics 已编入产物"
          else
            echo "::error::setDiagnostics 缺失（原生诊断门无法开关）"
            exit 1
          fi
          # 内容响应缓存里的章节列表那条规则。它没有 UI：一旦丢掉，表现只是
          # 「章节列表又发了三次」，面板上看不出来。**这一条只能查源码**：
          # 它唯一的诊断字面量只经过 CAPLog，release 产物里会被优化掉（第一次
          # 写成二进制 strings 检查时就是这样红的），而 `sajax=getchapterlist`
          # 又同时出现在 SiteI18nData 的注入块里，放在 strings 检查里会「因为
          # 别的地方有同样的字符串」而假装通过。源码检查证明的是「规则还在」，
          # 能不能链进产物由上面的编译与注册步骤负责。
          #
          # 第 45 轮把这条规则搬出了插件本体：分类在 SangTacHttpPlugin.contentClass，
          # 策略（TTL 与 SWR）与接受条件在 ContentCache.swift 的 ContentPolicies /
          # isChapterListBody。所以标记分成两组，各自查自己的文件——搬走之后还按老
          # 路径查，只会红在一句「源码里没有」，而不是红在规则丢了。
          #
          # `cacheLog(` 是第 46 轮加上的：缓存决策第一版只写 CAPLog（Console.app），
          # 侧载包读不到，于是真机日志里只有请求行、没有一条「命中/落盘/拒绝」，
          # 「到底有没有生效」在唯一能拿到的证据里没有答案。它必须是走面板的那条路。
          # 第 48 轮又补两条：拒绝要说清是哪条判据拒的（`case .reject(let why)`），
          # 以及那条答案实际长什么样（`head=`）—— 否则「not the shape this class
          # accepts」只说明有人在拒，不说明为什么，只能再猜一轮。
          # 第 49 轮的三条：
          #   `/mobile/lang/`       —— 站点自己的界面文案（5321 字节）是这份日志里
          #                            每次启动都要等 681-1716ms 的那一个请求，少了
          #                            这条分类它就又回到「每次启动都下一次」。
          #   `(HTTP error answer)` —— 4xx/5xx 以前完全不进决策块，于是一个「行为
          #                            就是被拒」的类（图片槽碰上防盗链）在日志里
          #                            一行都没有。
          #   `refused again` / `noteRefusal(` —— 同一张坏封面一次启动里被画三次
          #                            （852ms/次），一分钟内的重复拒绝不再打网络。
          # 第 50 轮的四条：
          #   `persistedRefusalClasses` —— 拒绝记录**只给图片**落盘的那条限制。这是
          #                            本轮唯一的风险开关：一条写下来的拒绝无法被
          #                            「成功」清掉（正是它挡住了那个能成功、也就能
          #                            自证错误的请求），所以只能靠固定窗口到期。
          #                            少了这条限制，一次瞬时 5xx 会变成半小时读不出
          #                            正文。删掉它不会有任何编译错误。
          #   `refusal written to disk` / `remembered on disk` —— 一写一读两半，日志
          #                            必须说清是「本进程记得」还是「上次启动写下的」，
          #                            否则「跨启动生效了吗」在唯一能拿到的证据里没
          #                            有答案。
          #   `noteGrantDigest`        —— grantcontext 是打开一本书时最后一项
          #                            0.7-1.2s（674-813KB），能不能复用取决于同一个
          #                            URL 两次的字节是否相同；日志里的 `head=` 截断
          #                            了，看不出来，所以逐字节摘要必须先落进日志。
          for marker in 'sajax=getchapterlist' 'contentClass(method:' 'cacheLog(' \
                        'case .reject(let why)' 'SangTacHttpPlugin.head(' \
                        '/mobile/lang/' '(HTTP error answer)' \
                        'refused again class=' 'noteRefusal(key: key' \
                        'persistedRefusalClasses' 'refusal written to disk' \
                        'remembered on disk' 'noteGrantDigest('; do
            if grep -q -F "$marker" plugins/http/ios/Sources/SangTacHttpPlugin/SangTacHttpPlugin.swift; then
              echo "✓ $marker 还在响应缓存源码里"
            else
              echo "::error::$marker 缺失（章节列表缓存规则被删改）"
              exit 1
            fi
          done
          for marker in 'case chapterList' 'isChapterListBody' '6 * 3600' \
                        'case siteAsset' 'isBlankIdentity(' \
                        'refusalRetention' 'storeRefusal(key:' 'RefusalRecord' \
                        'storedRefusal(' 'empty data'; do
            if grep -q -F "$marker" plugins/http/ios/Sources/SangTacHttpPlugin/ContentCache.swift; then
              echo "✓ $marker 还在内容缓存源码里"
            else
              echo "::error::$marker 缺失（章节列表缓存规则被删改）"
              exit 1
            fi
          done
          # `includesHost` 的 switch 在 SangTacHttpPlugin.swift 而不是 ContentCache.swift，
          # 所以它单独查自己的文件。**为什么必须盯**：这一行的值决定「镜像换了之后缓存还认不认」，
          # 而它错了不会有任何编译错误，只表现为「缓存命中率莫名变低」——日志里看不出来。
          # 第 55 轮把 `userInfo` 加进「不按 host 分键」那一组：预热请求只知道**页面**的 host
          # （sangtacviet.com，而页面自己报 alive=no），阅读器真正的请求走 bestDomain()
          # （sangtacviet.app），按 host 分键就是给一个永远查不到的名字写缓存。
          # 十份日志的读数：这类预热写了 14 次、被读过 0 次。
          if grep -q -F 'case .chapter, .chapterList, .siteAsset, .userInfo: return false' \
               plugins/http/ios/Sources/SangTacHttpPlugin/SangTacHttpPlugin.swift; then
            echo "✓ userInfo 与章节一样不按 host 分键"
          else
            echo "::error::includesHost 不再把 userInfo 排除在 host 之外（预热会写一个读不到的名字）"
            exit 1
          fi
          # 预热的 method 必须是阅读器自己的那一个（POST，app.v2.js:3998）。method 是
          # 缓存键的一部分，GET 只能写出一个 POST 永远查不到的名字——这正是那 14 次白写的另一半原因。
          if grep -q -F 'self.warmRequest(method: "POST", url: url, headers: headers)' \
               plugins/http/ios/Sources/SangTacHttpPlugin/SangTacHttpPlugin.swift; then
            echo "✓ userinfo 预热用的是阅读器自己的 POST"
          else
            echo "::error::userinfo 预热不再用 POST（GET 的缓存键与阅读器的 POST 不匹配，预热等于白做）"
            exit 1
          fi
          # 第 57 轮：镜像选择的第四条规则是「页面自己的 origin 优先」。cookie（access/useri2）
          # 与 grantcontext 签发的 key 都属于设置它的那个 host，换一台镜像就是用别人签发的
          # 状态——这是 §6.10 那个 code 7、以及「登录说 success 但其实没登录」的共同解释。
          # 删掉它不会有任何编译错误，只会退回「最快的镜像赢」，也就是这一条要修的那个 bug。
          # 钉的是 `location.origin`（运行时才知道），不是写死的主机名。
          for marker in 'var page = pageOrigin();' 'outranks the ping race'; do
            if grep -q -F "$marker" plugins/app/ios/Sources/SangTacAppPlugin/SitePatch.swift; then
              echo "✓ 页面 origin 优先（${marker}）还在"
            else
              echo "::error::镜像选择不再把页面 origin 放在竞速之前（${marker} 缺失，code 7 与登录会退回旧行为）"
              exit 1
            fi
          done
          # 第 55 轮把 `isChapterBody` 里的两道体积门槛撤掉了，这里必须**反向**盯住
          # 它们不许回来。理由不是风格，是同一种错犯了两次：
          #   * 第一次是「content-type 含 text/html 就当错误页拒掉」——站点所有 JSON
          #     端点都用 text/html 发，于是每章都被拒、缓存永远是空的。
          #   * 第二次是 `body.count >= 4096` 加 `data` 至少 256 字符。站点自己的
          #     渲染判据只有 `cdata.code == "0"`（chapterdisplay.js:790/:1813/:3682，
          #     那三个文件里根本没有长度判断）。19:38 的真机日志里 c=931037660 是
          #     作者的一行请假条：488 字节、117 字 `data`，站点照常渲染，我们却在
          #     每次打开时拒收（607ms/546ms/618ms 三次都走网络，一次都没落盘）。
          # 体积门槛只可能拒掉真内容——上面那些形状判断已经挡住了 HTML 拦截页、
          # 截断的 body、`code != 0` 与非字符串 `data`，能活下来的最小答案就是真答案。
          # 这两条**没有编译错误**：删掉它们只是日志里多几行拒绝，静态检查里看不出来。
          # 盯的是 `isChapterBody` 这个**函数体**，而不是整个文件：文件里别处
          # （BOM 探测的 `body.count >= 3`、图片接受条件的 `.count >= 512`）本来就有
          # 合法的体积判断，函数上方那段注释里也原样写着旧的拒绝文案——拿全局 grep
          # 或拿文案当标记，都会被这些正常内容误触发。
          chapter_gate=$(awk '/static func isChapterBody/,/^    }$/' \
            plugins/http/ios/Sources/SangTacHttpPlugin/ContentCache.swift)
          if [ -z "$chapter_gate" ]; then
            echo "::error::找不到 isChapterBody 的函数体（章节接受条件被改名或删除）"
            exit 1
          fi
          for floor in '.count >= ' 'data only '; do
            if printf '%s' "$chapter_gate" | grep -q -F "$floor"; then
              echo "::error::章节接受条件里又出现了体积门槛「${floor}」（站点自己只判 code == 0，加门槛只会拒掉真章节）"
              exit 1
            else
              echo "✓ 章节接受条件里没有体积门槛「${floor}」"
            fi
          done
          # 首次启动的语言选择只能由原生提供：WKWebView 的 navigator.language 是
          # **应用自己的**本地化（Capacitor 模板只有英文），不是设备语言，所以原生
          # 必须把 Locale.preferredLanguages 交给页面。**这一条只能查源码**：它只是
          # 一个 document start 的赋值语句，产物里有没有都被别的字符串掩盖。
          if grep -q -F 'window.__stvDeviceLang = ' plugins/app/ios/Sources/SangTacAppPlugin/SangTacAppPlugin.swift; then
            echo "✓ 设备语言已从原生交给页面"
          else
            echo "::error::设备语言未从原生交给页面（首次启动的语言选择会退回 navigator.language）"
            exit 1
          fi
          # 原生启动遮罩：站点 HTML 的 TTFB 约 1.3s，在那之前页面里没有任何我们的东西
          # （app 也没有 splash 插件，capacitor.config.json 里那行是空配置），所以这段
          # 空窗只能由原生盖住。撤下遮罩由页面在外壳释放时调用 —— 少了那个调用，遮罩会
          # 一直挂到 12 秒兜底。
          for marker in 'showBootOverlay()' 'bootOverlayHide' 'boot overlay shown'; do
            if grep -q -F "$marker" plugins/app/ios/Sources/SangTacAppPlugin/SangTacAppPlugin.swift; then
              echo "✓ $marker 还在 App 插件源码里"
            else
              echo "::error::$marker 缺失（原生启动遮罩被删改）"
              exit 1
            fi
          done
          # 系统离线翻译的三个桥接方法名。iOS 15-17 上它们也必须在（返回
          # "unsupported" 让 JS 换联网引擎），缺了会变成不透明的桥接错误。
          for marker in translationStatus translationPrepare translationTranslate; do
            if grep -q -F "$marker" "$syms.strings"; then
              echo "✓ $marker 已编入产物"
            else
              echo "::error::$marker 缺失"
              exit 1
            fi
          done

      - name: Verify the bundled asset mirror is inside the app
        run: |
          set -euo pipefail
          app="$(find ios/App/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "app: $app"
          # SwiftPM copies the target's resources into <Package>_<Target>.bundle.
          # A missing bundle leaves the mirror silently inert on device -- the app
          # still boots, it is just slow again -- so the build has to fail here
          # rather than the reader finding out.
          bundle="$(find "$app" -maxdepth 2 -name '*SangTacAppPlugin*.bundle' -type d | head -1)"
          if [ -z "$bundle" ]; then
            echo "::error::未找到 SangTacAppPlugin 资源包；本地资源镜像不会生效"
            find "$app" -maxdepth 2 -name '*.bundle' -type d || true
            exit 1
          fi
          echo "资源包: $bundle"
          for name in app.v2.js app.v2.css app.v2.bookdisplay.js app.v2.config.js \
                      app.v2.read.js app.v2.chapterdisplay.js stv.tts.js hanviet.js \
                      manifest.json; do
            if [ -f "$bundle/site-assets/$name" ]; then
              echo "✓ site-assets/$name $(wc -c < "$bundle/site-assets/$name") bytes"
            else
              echo "::error::资源包里缺少 site-assets/$name"
              ls -la "$bundle" || true
              exit 1
            fi
          done

      - name: Verify Translation.framework is weak linked
        run: |
          set -euo pipefail
          app="$(find ios/App/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          bin="$app/$(basename "$app" .app)"
          echo "binary: $bin"
          # 部署目标是 15.0，而 Translation 是 iOS 18 的框架。强链接会让
          # iOS 15-17 的 dyld 在任何代码执行前就中止启动，而这一点在编译期
          # 完全看不出来（本机 Windows 更看不到），所以只能查产物里的加载命令。
          linked="$(otool -l "$bin" | awk '/^ *cmd LC_LOAD_WEAK_DYLIB/ {k="weak"} /^ *cmd LC_LOAD_DYLIB/ {k="strong"} /Translation[.]framework/ {print k}')"
          echo "Translation.framework 链接方式: ${linked:-未链接}"
          if [ "$linked" != "weak" ]; then
            echo "::error::Translation.framework 必须是 LC_LOAD_WEAK_DYLIB（当前：${linked:-未链接}）"
            exit 1
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          app="$(find ios/App/build/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)"
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "::error::未找到 .app 产物"
            find ios/App/build/Build/Products -maxdepth 3 -type d || true
            exit 1
          fi
          echo "找到应用包: $app"
          rm -rf Payload && mkdir -p Payload
          cp -R "$app" Payload/
          rm -rf Payload/*.app/_CodeSignature
          rm -f Payload/*.app/embedded.mobileprovision
          zip -qry SangTacReader-unsigned.ipa Payload
          rm -rf Payload
          ls -lh SangTacReader-unsigned.ipa
          unzip -l SangTacReader-unsigned.ipa | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SangTacReader-unsigned
          path: SangTacReader-unsigned.ipa
          if-no-files-found: error

      # 滚动 Release：tag 固定为 latest、资产名固定为 SangTacReader-unsigned.ipa，
      # 于是下载地址长期稳定，可直接填进 SideStore / LiveContainer 的源：
      #   https://github.com/IamNewHands/SangTacReader/releases/latest/download/SangTacReader-unsigned.ipa
      # 每次构建先删旧 release 再建（--cleanup-tag），这样 tag 会跟着移动到最新提交。
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset=SangTacReader-unsigned.ipa
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/$asset"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          **未签名 IPA**，需在设备上用 SideStore / LiveContainer / SideInstaller
          以你自己的 Apple ID 本地签名后安装（仓库不含任何证书或描述文件）。

          - 提交：\`${GITHUB_SHA:0:7}\`
          - 构建：[#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - 内容：Capacitor iOS 工程（远程加载站点 + 自定义 Http/App/WebNativeView 插件）
          - 架构与证据链：docs/capacitor-port.md

          **稳定下载地址**（每次构建覆盖同一个文件）：
          $url
          EOF
          echo "=== release notes ==="; cat "$notes"
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create latest "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SangTacReader iOS（未签名最新构建）" \
            --notes-file "$notes" \
            --latest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
